# Builds the Mac DMG on a real macOS runner. Windows cannot produce a DMG.
name: Build Mac DMG

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  mac:
    runs-on: macos-14
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            desktop/package-lock.json
            package-lock.json

      - name: Install server deps (Mac-native modules)
        run: npm ci --omit=dev

      - name: Install desktop deps
        working-directory: desktop
        run: npm ci

      - name: Optional Mac libmpv
        run: |
          mkdir -p native_editor/vendor/mpv-mac
          if [ -n "${{ secrets.MPV_MAC_URL }}" ]; then
            curl -L "${{ secrets.MPV_MAC_URL }}" -o /tmp/mpv-mac.tgz
            tar -xzf /tmp/mpv-mac.tgz -C native_editor/vendor/mpv-mac
          else
            echo "No MPV_MAC_URL secret — DMG will rely on Homebrew ffplay / in-app fallbacks."
          fi

      - name: Build universal DMG + ZIP
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npm run dist:mac

      - name: Upload Mac artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dgs-auto-editor-mac
          path: |
            desktop/release/*.dmg
            desktop/release/*.zip
          if-no-files-found: error
